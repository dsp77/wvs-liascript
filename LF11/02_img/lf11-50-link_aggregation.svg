  <g
     font-family="Arial,sans-serif"
     fill="#141a21"
     id="g35">
    <text
       x="210"
       y="588"
       font-size="30"
       font-weight="bold"
       id="text32">Link Aggregation (Port-Bündelung):</text>
    <text
       x="215"
       y="630"
       font-size="24"
       id="text33">• Port 3 ↔ Port 3 und Port 4 ↔ Port 4: zwei physische Verbindungen.</text>
    <text
       x="215"
       y="665"
       font-size="24"
       id="text34">• Beide Verbindungen bilden einen logischen Link mit bis zu doppelter Gesamtkapazität.</text>
    <text
       x="215"
       y="699"
       font-size="24"
       id="text35">• Einzelne Datenströme nutzen normalerweise weiterhin nur eine physische Leitung.</text>
  </g>
